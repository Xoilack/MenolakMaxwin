#
dev: false

name: Demo Slot Admin Panel

description: Panel admin untuk mengatur saldo demo slot

poster: /assets/images/dafftube.png

avatar: /assets/images/logo_img.png

disqus:

google_analytics: 

url: http://localhost:4000/

baseurl: ""

permalink: /:title

version: v1.0.0

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded

# Admin Credentials (Ubah sesuai keinginan)
ADMIN_USERNAME: admin
ADMIN_PASSWORD_HASH: 5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8 # SHA256 dari "password"

# Firebase Config (Ganti dengan config asli Anda)
API_KEY: YOUR_API_KEY
AUTH_DOMAIN: YOUR_AUTH_DOMAIN
DATABASE_URL: YOUR_DATABASE_URL
PROJECT_ID: YOUR_PROJECT_ID
STORAGE_BUCKET: YOUR_STORAGE_BUCKET
SENDER_ID: YOUR_SENDER_ID
APP_ID: YOUR_APP_ID

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sass-converter

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
